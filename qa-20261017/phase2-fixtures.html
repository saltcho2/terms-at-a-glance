<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>약관 한눈에 — 오류 처리 검증</title><style>body{font:16px system-ui;margin:20px;color:#192837}button{font:inherit;padding:10px;margin:4px}iframe{width:100%;height:780px;border:1px solid #66717d}#fixtureStatus{padding:10px;background:#fff2c7}</style></head><body>
<h1>오류 처리 검증 전용 페이지</h1><p>현재 배포 HTML을 읽어 아래 프레임에만 오류를 주입합니다. 실제 운영 데이터와 정상 사이트의 상태를 변경하지 않습니다.</p>
<button type="button" data-fixture="normal">정상 자료</button><button type="button" data-fixture="catalog404">검색 파일 로딩 실패</button><button type="button" data-fixture="case404">사례 파일 로딩 실패</button><button type="button" data-fixture="zero">사례 0건</button>
<button data-width="360">360px</button><button data-width="390">390px</button><button data-width="430">430px</button><pre id="metrics">계측 대기</pre><p id="fixtureStatus" role="status">검증 조건을 선택하세요.</p><iframe id="fixtureFrame" title="배포본 오류 처리 검증 화면"></iframe>
<script>
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{document.querySelector('#fixtureFrame').style.width=b.dataset.width+'px';});
window.addEventListener('message',e=>{if(e.source===document.querySelector('#fixtureFrame').contentWindow&&e.data?.type==='qa-metrics')document.querySelector('#metrics').textContent=JSON.stringify(e.data,null,2);});
document.querySelectorAll('[data-fixture]').forEach(button=>button.addEventListener('click',async()=>{
 const status=document.querySelector('#fixtureStatus'),mode=button.dataset.fixture;
 status.textContent='배포 HTML을 불러오는 중';
 try{
  const base=new URL('../',location.href),response=await fetch(new URL('index.html',base),{cache:'no-store'});
  if(!response.ok)throw Error('HTML 요청 실패: '+response.status);
  const page=new DOMParser().parseFromString(await response.text(),'text/html'),baseTag=page.createElement('base');baseTag.href=base.href;page.head.prepend(baseTag);
  if(mode==='catalog404')page.querySelector('script[src^="service-catalog.js"]').src=new URL('qa-20261017/intentional-missing-catalog.js',base).href;
  if(mode==='case404')page.querySelector('script[src^="casebook.js"]').src=new URL('qa-20261017/intentional-missing-cases.js',base).href;
  if(mode==='zero'){const script=page.querySelector('script[src^="casebook.js"]'),replacement=page.createElement('script');replacement.textContent='window.serviceCases={};';script.replaceWith(replacement);}
  const meter=page.createElement('script');meter.textContent=`function reportMetrics(){const resources=performance.getEntriesByType('resource').map(r=>({url:r.name,type:r.initiatorType,transferSize:r.transferSize,encodedBodySize:r.encodedBodySize}));parent.postMessage({type:'qa-metrics',viewport:innerWidth,scrollWidth:document.documentElement.scrollWidth,resourceCount:resources.length,htmlFetches:1,resources,note:'브라우저 Resource Timing 관측. 캐시 포함; 서버 로그 요청 수·모바일 실기기 검증 아님'},'*');}addEventListener('load',reportMetrics);addEventListener('resize',reportMetrics);`;page.body.append(meter);
  document.querySelector('#fixtureFrame').srcdoc='<!doctype html>'+page.documentElement.outerHTML;
  status.textContent='선택한 검증 조건: '+button.textContent+' · 실제 운영 데이터는 변경하지 않음';
 }catch(error){status.textContent=String(error.message);}
}));
</script></body></html>
