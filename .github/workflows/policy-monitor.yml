name: Policy source snapshot monitor
on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/check_policy_sources.py', 'scripts/test_policy_sources.py', 'service-catalog.js', '.github/workflows/policy-monitor.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: policy-source-monitor
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/test_policy_sources.py
      - run: python3 scripts/check_policy_sources.py
      - name: Save observation records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-monitor.json source-status.js
          if ! git diff --cached --quiet; then
            git commit -m 'Record policy source snapshot observations'
            git push
          fi
      - name: Publish updated observation records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/pages/builds'
          req=urllib.request.Request(url,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as response:
              print('Pages build request status:',response.status)
          PY
